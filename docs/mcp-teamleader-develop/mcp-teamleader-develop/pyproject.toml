[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-teamleader"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
    "requests",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["venv*"]
